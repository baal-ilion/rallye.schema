services:
  rallye-webapp:
    container_name: "rallye-webapp"
    build:
      context: .
      dockerfile: Dockerfile-prod
    image: rallye-webapp:local
    volumes:
      - './config:/usr/share/nginx/html/config:ro'
      - './certs:/etc/nginx/certs:ro'
    ports:
      - '80:80'
      - '443:443'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
