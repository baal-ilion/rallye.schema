apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rallye-webapp
  name: rallye-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rallye-webapp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: rallye-webapp
    spec:
      containers:
      - image: baalilion/rallye-webapp
        name: rallye-webapp
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /usr/share/nginx/html/config
          name: rallye-webapp-config
      restartPolicy: Always
      volumes:
      - name: rallye-webapp-config
        persistentVolumeClaim:
          claimName: rallye-webapp-config
