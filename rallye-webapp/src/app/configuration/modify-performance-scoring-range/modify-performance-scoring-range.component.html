<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h4 class="modal-title mb-0 text-center flex-fill">Calcul des points</h4>
    <button type="button" class="btn btn-danger text-white w-auto px-3 py-2 d-flex align-items-center justify-content-center ml-4" style="min-width:2.5rem;min-height:2.5rem;line-height:1;padding:0.4rem 0.6rem;" aria-label="Close"
      (click)="dialogRef.close()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <form [formGroup]="rangeForm" (ngSubmit)="submitForm()">
    <div class="card-body">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <input formControlName="pointType" type="radio" name="pointType" value="point" />
          </div>
          <label class="input-group-text" for="point">Points</label>
        </div>
        <input type="number" class="form-control" formControlName="point"
          [attr.disabled]="rangeForm.value.pointType != 'point' ? '' : null" />
      </div>
      <div class="input-group mt-3">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <input formControlName="pointType" type="radio" name="pointType" value="expression" />
          </div>
          <label class="input-group-text" for="expression">Expression</label>
        </div>
        <input type="text" class="form-control" formControlName="expression" (ngModelChange)="computeResult()"
          [attr.disabled]="rangeForm.value.pointType != 'expression' ? '' : null" />
      </div>
      <small class="form-text text-muted">
        La fonction #arrondi(...) permet de transformer un nombre à virgule en nombre entier.
      </small>
      <div class="border rounded mt-3">
        <fieldset [disabled]="rangeForm.value.pointType != 'expression'">
          <div class="m-2">
            <legend>Simulation</legend>
            <div class="simulation-grid">
              <div class="simulation-field">
                <label *ngIf="perfPointAllocationType[range.type] === 'SCORE'" for="value">Score</label>
                <label *ngIf="perfPointAllocationType[range.type] === 'RANK'" for="value">Rang</label>
                <label *ngIf="perfPointAllocationType[range.type] === 'DATE'" for="value">N° de passage</label>
                <span class="simulation-variable">#valeur</span>
                <app-performance-value-input *ngIf="perfPointAllocationType[range.type] === 'SCORE'; else numericSimulationValue"
                  id="value" formControlName="value"
                  [format]="performanceScoring?.valueFormat || defaultFormat"
                  [decimalPlaces]="performanceScoring?.decimalPlaces ?? 2"
                  [unit]="performanceScoring?.unit || ''">
                </app-performance-value-input>
                <ng-template #numericSimulationValue>
                  <input id="value" type="number" class="form-control" formControlName="value"
                    (ngModelChange)="computeResult()" />
                </ng-template>
              </div>
              <div class="simulation-field">
                <label for="nbAllTeam">Nombre d'équipes inscrites</label>
                <span class="simulation-variable">#nbEqInscrites</span>
                <input id="nbAllTeam" type="number" class="form-control" formControlName="nbAllTeam"
                  (ngModelChange)="computeResult()" />
              </div>
              <div class="simulation-field">
                <label for="nbTeam">Nombre d'équipes ayant participé à l'épreuve</label>
                <span class="simulation-variable">#nbEqParticipantes</span>
                <input id="nbTeam" type="number" class="form-control" formControlName="nbTeam"
                  (ngModelChange)="computeResult()" />
              </div>
            </div>
            <div class="simulation-result mt-3">
              <label>Résultat</label>
              <div class="input-group">
                <input *ngIf="rangeForm.value.pointType != 'expression'" type="text" class="form-control"
                  [value]="result" />
                <div *ngIf="rangeForm.value.pointType == 'expression'" class="form-control">
                  {{ result !== null ? result : '—' }}
                </div>
              </div>
              <small *ngIf="simulationError" class="text-danger mt-1">{{ simulationError }}</small>
            </div>
          </div>
        </fieldset>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-center">
      <div class="d-flex">
        <button class="btn btn-success" [disabled]="!rangeForm.valid">
          Appliquer la formule
        </button>
      </div>
    </div>
  </form>
</div>
