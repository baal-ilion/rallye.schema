<div class="container">

  <div class="row mt-4 text-center">
    <h1 class="col-12 page-title-with-subtitle">Suivi de présence<span class="page-title-subtitle">Liste des équipes et statut de présence</span></h1>
  </div>

  <div class="row mt-3" *ngIf="loading || error">
    <div class="col-12">
      <div *ngIf="loading" class="alert alert-info mt-3">
        Chargement des équipes...
      </div>

      <div *ngIf="error" class="alert alert-danger mt-3">
        {{ error }}
      </div>
    </div>
  </div>

  <div class="presence-container mt-4" *ngIf="!loading && !error">
    <div class="presence-column">
      <div class="card h-100" [style.width.px]="cardWidth">
        <div class="card-header font-weight-bold text-center">Absentes</div>
        <div class="card-body">
          <div *ngIf="absentTeams.length === 0" class="text-muted">Aucune équipe absente.</div>
          <ul class="list-unstyled mb-0 presence-list">
            <li *ngFor="let team of absentTeams; trackBy: trackTeam" class="mb-3">
              <div class="card h-100 presence-card">
                <div class="card-header font-weight-bold">
                  Équipe {{ team.team }}
                </div>
                <div class="card-body">
                  <div>{{ team.name }}</div>
                </div>
                <div class="card-footer text-center">
                  <button
                    type="button"
                    class="btn btn-sm btn-success"
                    (click)="onPresenceChange(team, true)">
                    Marquer présente
                  </button>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <div class="presence-column">
      <div class="card h-100" [style.width.px]="cardWidth">
        <div class="card-header font-weight-bold text-center present-teams-header">Présentes</div>
        <div class="card-body">
          <div *ngIf="presentTeams.length === 0" class="text-muted">Aucune équipe présente.</div>
          <ul class="list-unstyled mb-0 presence-list">
            <li *ngFor="let team of presentTeams; trackBy: trackTeam" class="mb-3">
              <div class="card h-100 presence-card">
                <div class="card-header font-weight-bold">
                  Équipe {{ team.team }}
                </div>
                <div class="card-body">
                  <div>{{ team.name }}</div>
                </div>
                <div class="card-footer text-center">
                  <button
                    type="button"
                    class="btn btn-sm btn-danger"
                    (click)="onPresenceChange(team, false)">
                    Marquer absente
                  </button>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>

</div>
