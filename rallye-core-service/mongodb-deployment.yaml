apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mongodb
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - image: mongo
        name: mongodb
        ports:
        - containerPort: 27017
        volumeMounts:
        - mountPath: /data/db
          name: mongodb-db
        - mountPath: /data/configdb
          name: mongodb-configdb
      restartPolicy: Always
      volumes:
      - name: mongodb-db
        persistentVolumeClaim:
          claimName: mongodb-db
      - name: mongodb-configdb
        persistentVolumeClaim:
          claimName: mongodb-configdb
