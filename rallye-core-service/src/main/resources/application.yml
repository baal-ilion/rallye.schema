# Fichier template par défaut
# Port HTTPS de l'application (profil par défaut)
server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:keystore-local.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: rallye-schema
# Paramétrage de spring
spring:
  data:
# Paramétrage de mongodb
    mongodb:
      database: rallye
      host: localhost
      port: 27017
      auto-index-creation: true
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: -1
      max-request-size: -1
# AMQP RabbitMQ configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
# Additional RabbitMQ properties
    listener:
      simple:
        auto-startup: true
        concurrency: 4
        max-concurrency: 8
        retry:
          initial-interval: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

form-processing:
  url: ${FORM_PROCESSING_URL:http://localhost:8085}
  batch-url: ${FORM_PROCESSING_BATCH_URL:${FORM_PROCESSING_URL:http://localhost:8085}}

---
spring:
  profiles: test
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  data:
    mongodb:
      database: rallye-test
      host: localhost
      port: 27017

---
spring:
  profiles: docker
  data:
    mongodb:
      database: rallye
      host: mongodb
      port: 27017
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: rallyeschema
    password: rallyeschema
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: -1
      max-request-size: -1
server:
  port: 8443
  ssl:
    enabled: true
    key-store: file:/app/certs/keystore.p12
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    key-alias: rallye-schema
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
