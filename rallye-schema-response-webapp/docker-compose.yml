services:
  rallye-schema-response-webapp:
    container_name: "rallye-schema-response-webapp"
    build:
      context: .
      dockerfile: Dockerfile-prod
    image: rallye-schema-response-webapp:local
    volumes:
      - 'rallye-schema-response-webapp-app:/app'
      - './config:/usr/share/nginx/html/config:ro'
      - '/app/node_modules'
      - './certs:/etc/nginx/certs:ro'
    ports:
      - '80:80'
      - '443:443'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
volumes:
  rallye-schema-response-webapp-app:
