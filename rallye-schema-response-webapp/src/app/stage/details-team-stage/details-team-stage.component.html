<div class="container mb-5">
  <div class="row mt-4 text-center">
    <h1 class="col-12 page-title-with-subtitle">Détails d'une épreuve d'une équipe<span class="page-title-subtitle">Consultez la participation, les réponses et le résultat enregistrés.</span></h1>

  </div>
</div>
