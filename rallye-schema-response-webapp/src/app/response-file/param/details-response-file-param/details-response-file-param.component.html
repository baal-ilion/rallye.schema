<div class="container-fluid">
  <div class="row justify-content-center" *ngIf="param">
    <h1>Épreuve {{param.stage}} / Page {{param.page}}</h1>
  </div>
  <div *ngIf="param" class="row justify-content-center">
    <app-details-template-param [param]="param" [modelUrl]="modelUrl"></app-details-template-param>
  </div>
  <div *ngIf="questions" class="d-flex flex-row flex-wrap">
    <div *ngFor="let question of questions" class="">
      <div class="">
        <div class="col-3">
          <span>{{question.name}}</span>
        </div>
        <select class="form-group custom-select" [(ngModel)]="question.type" disabled>
          <option value="STAGE">Épreuve</option>
          <option value="PAGE">Page</option>
          <option value="TEAM">Équipe</option>
          <option value="QUESTION">Question</option>
          <option value="PERFORMANCE">Performance</option>
        </select>
      </div>
    </div>
  </div>
  <div class="row justify-content-center mt-3">
    <div class="col-auto">
      <button class="btn btn-primary w-auto" ngbButtonLabel (click)='openModifyResponseFileParam()' type="button">
        Modifier
      </button>
    </div>
    <div class="col-auto">
      <button class="btn btn-danger w-auto" ngbButtonLabel (click)='deleteResponseFileParam()' type="button">
        Supprimer
      </button>
    </div>
  </div>
</div>
