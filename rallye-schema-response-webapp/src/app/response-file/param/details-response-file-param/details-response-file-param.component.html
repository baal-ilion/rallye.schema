<div class="response-page-panel" *ngIf="param">
  <h4 class="response-page-title">Épreuve {{param.stage}} / Page {{param.page}}</h4>
  <div class="response-page-preview">
    <app-details-template-param [param]="param" [modelUrl]="modelUrl"></app-details-template-param>
  </div>
  <div class="row justify-content-center mt-3 mx-0">
    <div class="col-auto">
      <button class="btn btn-primary w-auto"  (click)='openModifyResponseFileParam()' type="button">
        Modifier
      </button>
    </div>
    <div class="col-auto">
      <button class="btn btn-danger w-auto"  (click)='deleteResponseFileParam()' type="button">
        Supprimer
      </button>
    </div>
  </div>
</div>
