<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h4 class="modal-title mb-0 text-center flex-fill">Nouvelle épreuve</h4>
    <button type="button" class="btn btn-danger text-white w-auto px-3 py-2 d-flex align-items-center justify-content-center ml-4" style="min-width:2.5rem;min-height:2.5rem;line-height:1;padding:0.4rem 0.6rem;" aria-label="Close"
      (click)="dialogRef.close()">&times;</button>
  </div>
  <form [formGroup]="stageParamForm" (ngSubmit)="submitForm()">
    <div class="card-body">
      <div class="form-group">
        <label for="stage">Numéro</label>
        <input id="stage" type="number" class="form-control" formControlName="stage"
          [ngClass]="{ 'is-invalid': stageParamForm.controls.stage.errors }">
        <div *ngIf="stageParamForm.controls.stage.errors" class="invalid-feedback">
          <div *ngIf="stageParamForm.controls.stage.errors.required">Le numéro d'épreuve est requis</div>
          <div *ngIf="stageParamForm.controls.stage.errors.uniqueStage">Ce numéro d'épreuve existe déjà</div>
        </div>
      </div>
      <div class="form-group mt-2">
        <label for="name">Nom</label>
        <input id="name" type="text" class="form-control" formControlName="name"
          [ngClass]="{ 'is-invalid': stageParamForm.controls.name.errors }">
        <div *ngIf="stageParamForm.controls.name.errors" class="invalid-feedback">
          <div *ngIf="stageParamForm.controls.name.errors.required">Le nom est requis</div>
        </div>
      </div>
      <div class="form-group mt-2">
        <label for="group">Groupe</label>
        <select id="group" class="form-control" formControlName="group">
          <option [ngValue]="null">Aucun</option>
          <option *ngFor="let group of stageGroups" [ngValue]="group">{{ group.name }}</option>
        </select>
      </div>
    </div>
    <div class="card-footer d-flex justify-content-center">
      <div class="d-flex">
        <button class="btn btn-success" [disabled]="!stageParamForm.valid">
          Valider
        </button>
      </div>
    </div>
  </form>
</div>
