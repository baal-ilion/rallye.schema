<div class="container mb-5">
  <div class="row mt-4 text-center">
    <h1 class="col-12">Import / Export du paramétrage</h1>
  </div>

  <div class="row justify-content-center mt-4">
    <div class="col-12 d-flex flex-column align-items-start">
      <div class="mb-2">Export du paramétrage</div>
      <a [href]="exportlink" class="btn btn-primary text-white w-auto px-3 mb-0 rounded">
        <i class="fas fa-download mr-1"></i> Exporter
      </a>

      <div class="my-4" aria-hidden="true"></div>

      <div class="mb-1">Import du paramétrage</div>
      <div class="w-auto mt-2 d-flex align-items-center">
        <input #importFile type="file" class="d-none" id="importFile" accept="application/zip"
          (change)="upload($event.target.files)">
        <label class="btn btn-primary text-white w-auto px-3 mb-0 rounded" for="importFile">
          <i class="fas fa-search mr-1"></i> Choisir un fichier
        </label>
        <span class="ml-3 pl-1 text-muted">&nbsp;Aucun fichier choisi</span>
      </div>

      <div *ngFor="let uploadFile of uploadedFiles" class="mt-3 w-100">
        <ngb-progressbar
          type="info"
          [value]="uploadFile.progress.percentage"
          max="100"
          [striped]="true"
          [animated]="uploadFile.progress.percentage != 100">
          {{uploadFile.file.name}} - {{uploadFile.progress.percentage}}%
        </ngb-progressbar>
      </div>
    </div>
  </div>
</div>
