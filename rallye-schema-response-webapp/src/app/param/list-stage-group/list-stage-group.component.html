<div class="container mb-5">

  <div class="row mt-4 align-items-center">
    <div class="col-12 d-flex align-items-center">
      <h1 class="flex-grow-1 mb-0 text-center">Groupes d'épreuves</h1>
      <button class="btn btn-success btn-sm" (click)="onCreate()">
        Ajouter un groupe
      </button>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12 py-1 bg-secondary">
      <h4 class="my-auto text-center text-white">
        Gestion des groupes d'épreuves
      </h4>
    </div>
  </div>

  <!-- Messages chargement / erreur -->
  <div class="row mt-3" *ngIf="loading || error">
    <div class="col-12">
      <div *ngIf="loading" class="alert alert-info">Chargement...</div>
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    </div>
  </div>

  <!-- Liste des groupes -->
  <div class="row mt-0">
    <div class="col-12">
      <table class="table table-sm">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Description</th>
            <th style="width: 200px;"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let group of groups">
            <td>{{ group.name }}</td>
            <td>{{ group.description }}</td>
            <td class="text-right">
              <button
                class="btn btn-primary btn-sm"
                style="margin-right: 0.5rem;"
                (click)="onEdit(group)"
              >
                Modifier
              </button>
              <button
                class="btn btn-danger btn-sm"
                (click)="onDelete(group)"
              >
                Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
