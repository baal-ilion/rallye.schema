<div class="container mb-5">

  <div class="row mt-4 align-items-center page-title-actions-row">
    <div class="col-12 d-flex align-items-center">
      <h1 class="flex-grow-1 mb-0 text-center page-title-with-subtitle">Groupes d'épreuves<span class="page-title-subtitle">Gestion des groupes d'épreuves</span></h1>
      <button class="btn btn-success" (click)="onCreate()">
        Ajouter un groupe
      </button>
    </div>
  </div>

  <div class="data-table-fit">
  <div class="row mt-4 table-title-row">
    <div class="col-12 py-1 bg-secondary">
      <h4 class="my-auto text-center text-white">Liste des groupes d'épreuves</h4>
    </div>
  </div>
  <!-- Messages chargement / erreur -->
  <div class="row mt-3" *ngIf="loading || error">
    <div class="col-12">
      <div *ngIf="loading" class="alert alert-info">Chargement...</div>
      <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    </div>
  </div>

  <!-- Liste des groupes -->
  <div class="row mt-0 table-content-row">
    <div class="col-12 px-0">
      <table class="table table-sm">
        <thead>
          <tr>
            <th>Nom</th>
            <th class="table-actions-column text-right">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let group of groups">
            <td>{{ group.name }}</td>
            <td class="table-actions-column text-right">
              <button
                class="btn btn-primary btn-sm table-action-button mr-2"
                (click)="onEdit(group)"
              >
                Modifier
              </button>
              <button
                class="btn btn-danger btn-sm table-action-button"
                (click)="onDelete(group)"
              >
                Supprimer
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </div>

</div>
