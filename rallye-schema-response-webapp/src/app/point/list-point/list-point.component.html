<div class="container mb-5">
  <div class="row mt-4 text-center">
    <h1 class="col-9" id="ranking_title">Détail des points</h1>
    <div class="col-3 m-auto p-0 text-center">
      <button class="btn btn-primary"  (click)='recomputePoints()'>Recalculer les points</button>
    </div>
  </div>
  <div class="row">
    <app-log-files class="col-12"></app-log-files>
  </div>
  <div *ngIf="error" class="alert alert-danger mt-3">
    {{ error }}
  </div>
  <div *ngIf="loading" class="alert alert-info mt-3">
    Chargement des points...
  </div>
  <div *ngIf='points && points.length > 0' class="row">
    <div *ngFor="let point of points">
      <app-details-point class="col-12" [point]='point'></app-details-point>
    </div>
  </div>
</div>
