<div class="container mb-5">
  <div class="row mt-4 text-center">
    <h1 class="col-12">Distribution des lots</h1>
  </div>

  <!-- Messages de statut -->
  <div *ngIf="loading" class="alert alert-info mt-3">
    Calcul de la distribution des lots...
  </div>

  <div *ngIf="error" class="alert alert-danger mt-3">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error && prizes.length === 0" class="alert alert-secondary mt-3">
    Aucun lot ne peut être attribué pour le moment.
  </div>

  <!-- Une seule section avec un tableau unique -->
  <div *ngIf="!loading && !error && prizes.length > 0" class="data-table-fit">
  <div class="row mt-4">
    <div class="col-12 px-0 py-1 bg-secondary">
      <h4 class="my-auto text-center text-white">
        Lots attribués
      </h4>
    </div>
    <div class="col-12 px-0 table-responsive text-nowrap">
      <table class="table table-sm align-items-center prize-table mb-0">
        <thead class="bg-light">
          <tr>
            <th scope="col" class="align-middle compact-column">Groupe</th>
            <th scope="col" class="align-middle compact-column">N° équipe</th>
            <th scope="col" class="align-middle fluid-column">Nom de l'équipe</th>
            <th scope="col" class="align-middle compact-column">Rang</th>
            <th scope="col" class="align-middle compact-column">Points</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let prize of prizes">
            <td class="align-middle compact-column">
              {{ getGroupLabel(prize) }}
            </td>
            <td class="align-middle compact-column">
              {{ prize.team }}
            </td>
            <td class="align-middle fluid-column">
              {{ prize.teamName }}
            </td>
            <td class="align-middle compact-column">
              {{ prize.rank }}
            </td>
            <td class="align-middle compact-column">
              {{ prize.score }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  </div>
</div>
