<div class="container mb-5">
  <div class="row mt-4">
    <h1 class="col-12 text-center">Vérification de l'import des formulaires de réponses</h1>
  </div>
  <app-pagination [collectionSize]="pages.totalElements" pageSize="1" [(page)]="page" [boundaryLinks]="true"
    [disabled]="pages.totalElements === 0"
    (pageChange)="loadPage($event)" class="d-flex justify-content-center mt-4">
  </app-pagination>
  <div *ngIf='pages.totalElements > 0'>
    <div class="row justify-content-center mt-1">
      <app-details-upload *ngIf="responseFileInfos.length" class="col-12" [fileUpload]='responseFileInfos[0]' (checkedEvent)="deletePage(page)"
        (deleteEvent)="deletePage(page)">
      </app-details-upload>
    </div>
  </div>
  <app-pagination [collectionSize]="pages.totalElements" pageSize="1" [(page)]="page" [boundaryLinks]="true"
    [disabled]="pages.totalElements === 0"
    (pageChange)="loadPage($event)" class="d-flex justify-content-center mt-2">
  </app-pagination>
</div>
