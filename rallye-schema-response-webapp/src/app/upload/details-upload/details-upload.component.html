<section class="verification-card" *ngIf="fileUpload">
  <header class="verification-header">
    <div>
      <span class="verification-kicker">Formulaire à vérifier</span>
      <strong>Équipe {{fileUpload.team}} · Épreuve {{fileUpload.stage}} · Page {{fileUpload.page}}</strong>
    </div>
    <button type="button" class="btn btn-sm btn-outline-primary" (click)="openModifyUpload()">
      <i class="fas fa-pen mr-1"></i> Corriger l’identification
    </button>
  </header>

  <div class="verification-help">
    <i class="fas fa-arrows-alt"></i>
    Si nécessaire, faites glisser les quatre repères d’angle : les zones de lecture seront recalculées automatiquement.
  </div>

  <div class="verification-document">
    <app-details-response-file [fileUpload]="fileUpload" [dragable]="true" (endDragEvent)="endDrag($event)">
    </app-details-response-file>
  </div>

  <footer class="verification-actions">
    <app-response-file-actions [responseFileInfo]="fileUpload" (checkedEvent)="check($event)"
      (deleteEvent)="delete($event)"></app-response-file-actions>
  </footer>
</section>
