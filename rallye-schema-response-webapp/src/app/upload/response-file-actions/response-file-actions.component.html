<div *ngIf="context === 'verification' && !isSelected && selecteds.length > 0" class="duplicate-warning">
  <strong>Cette page possède déjà une feuille utilisée.</strong>
  <span>Comparez les exemplaires avant de choisir celui à conserver.</span>
</div>
<div *ngIf="actionError" class="alert alert-danger mt-2 mb-2" role="alert">{{actionError}}</div>
<div class="d-flex justify-content-center mt-2 text-center" *ngIf="!loading">
  <div class="btn-group d-flex justify-content-center flex-wrap">
    <ng-container *ngIf="context === 'verification'">
    <button type="button" *ngIf="!responseFileInfo.checked && sameFiles.length <= 1" class="btn btn-success"
      (click)="check()">Accepter</button>
    <button type="button" *ngIf="sameFiles.length > 1" class="btn btn-primary"
      (click)="openDuplicateComparison()">Comparer les doublons</button>
    <button type="button" class="btn btn-danger" (click)="delete()">Supprimer</button>
    </ng-container>

    <ng-container *ngIf="context === 'validation'">
      <button type="button" class="btn btn-primary" (click)="uncheck()">Renvoyer vers le traitement</button>
      <button type="button" class="btn btn-danger" (click)="delete()">Supprimer définitivement</button>
    </ng-container>
  </div>
</div>
