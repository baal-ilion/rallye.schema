<div class="container mb-5">
  <div class="row mt-4 text-center">
    <h1 class="col-12">Import de formulaires de réponses</h1>
  </div>

  <div class="row justify-content-center mt-4">
    <div class="col-12 d-flex flex-column align-items-start">
      <div>Sélectionnez des formulaires de réponses corrigés.</div>

      <div class="w-auto mt-2">
        <input
          #fileInput
          type="file"
          class="d-none"
          multiple
          id="importFile"
          accept="image/*"
          (change)="selectFile($event.target.files)">
        <button type="button" class="btn btn-primary text-white" (click)="fileInput.click()">
          <i class="fas fa-search mr-1"></i> Sélectionner
        </button>
      </div>

      <div class="mt-2 text-left">
        {{selectedNames?.length || 0}} formulaire(s) sélectionné(s)
      </div>
      <div *ngIf="selectedNames?.length" class="mt-1 text-left">
        <div *ngFor="let name of selectedNames">{{name}}</div>
      </div>

      <div class="my-4" aria-hidden="true"></div>
      <div class="mb-1">Importez les fichiers sélectionnés.</div>
      <button class="btn btn-primary" ngbButtonLabel [disabled]="!selectedFiles" (click)="upload()">Importer</button>

      <div *ngFor="let uploadFile of uploadedFiles" class="mt-3 w-100">
        <ngb-progressbar
          type="info"
          [value]="uploadFile.progress.percentage"
          max="100"
          [striped]="true"
          [animated]="uploadFile.progress.percentage != 100">
          {{uploadFile.file.name}} - {{uploadFile.progress.percentage}}%
        </ngb-progressbar>
      </div>
    </div>
  </div>
</div>
