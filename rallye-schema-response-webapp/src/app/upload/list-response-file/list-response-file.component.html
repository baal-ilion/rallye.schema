<div class="card">
  <div class="card-header d-flex align-items-center justify-content-between">
    <h4 class="modal-title mb-0 text-center flex-fill">Doublon n°{{page}} - Équipe {{responseFiles[page-1].team}} / Épreuve
      {{responseFiles[page-1].stage}} / Page {{responseFiles[page-1].page}}</h4>
    <button type="button" class="btn btn-danger text-white w-auto px-3 py-2 d-flex align-items-center justify-content-center ml-4"
      style="min-width:2.5rem;min-height:2.5rem;line-height:1;padding:0.4rem 0.6rem;" aria-label="Close"
      (click)="dialogRef.close()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="card-body">
    <app-pagination *ngIf="responseFiles.length > 1" [collectionSize]="responseFiles.length" pageSize="1"
      [(page)]="page" [boundaryLinks]="true" [disabled]="responseFiles.length === 0"
      class="row justify-content-center mt-2">
    </app-pagination>
    <app-details-response-file class="row justify-content-center mt-1" [fileUpload]="responseFiles[page-1]"
      [dragable]="false">
    </app-details-response-file>
    <app-pagination *ngIf="responseFiles.length > 1" [collectionSize]="responseFiles.length" pageSize="1"
      [(page)]="page" [boundaryLinks]="true" [disabled]="responseFiles.length === 0"
      class="row justify-content-center mt-2">
    </app-pagination>
    <div class="row border-top justify-content-center mt-2">
      <div class="col-12 mt-2">
        <app-response-file-actions [responseFileInfo]="responseFiles[page-1]"
          (deleteEvent)="delete(responseFiles[page-1])" (checkedEvent)="check($event)" [viewOtherFiles]="false">
        </app-response-file-actions>
      </div>
    </div>
  </div>
</div>
